<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birdie Book</title>
<meta name="description" content="Notizbuch für Golfplätze – pro Loch und Tee, komplett offline.">
<meta name="theme-color" content="#1f4d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Birdie Book">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f3f0e6; --surface:#fffdf7; --surface-2:#e9e4d4; --text:#1c2a20; --muted:#6a7268; --line:#dcd5c1;
  --green:#1f4d2e; --accent:#2f7a4a; --on-accent:#fff; --danger:#b3362f;
  --radius:14px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1712; --surface:#17221a; --surface-2:#22332a; --text:#e6eee7; --muted:#9aab9e; --line:#2c3d31;
         --green:#14321e; --accent:#4fae73; --on-accent:#08140c; --danger:#e3685f; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.muted{color:var(--muted)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

#app{min-height:100%;display:flex;flex-direction:column}
#app.full{height:100vh;height:100dvh;overflow:hidden}

/* Kopfzeile */
.topbar{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;
  padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) 10px calc(var(--sl) + 12px)}
.topbar h1{font-size:18px;line-height:1.2;margin:0;flex:1;min-width:0}
.topbar h1 .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;opacity:.85}
.iconbtn{background:rgba(255,255,255,.13);border:0;border-radius:10px;min-width:40px;height:40px;display:inline-grid;place-items:center;color:#fff;flex:none}
.iconbtn:active{background:rgba(255,255,255,.25)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:8px}

/* Seiten */
.page{width:100%;max-width:760px;margin:0 auto;padding:18px calc(var(--sr) + 16px) calc(var(--sb) + 28px) calc(var(--sl) + 16px)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 12px}
section + section{margin-top:32px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.45}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);
  padding:14px 16px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px}
.card-title{font-weight:700;font-size:17px}
.card-meta{grid-column:1;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.chev{grid-row:1/3;grid-column:2;color:var(--muted);font-size:22px}
.empty{border:2px dashed var(--line);border-radius:var(--radius);padding:28px 20px;text-align:center}
.empty p{margin:4px 0}

.tee-dot{width:14px;height:14px;border-radius:50%;background:var(--tee);flex:none;display:inline-block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tee-dot.lg{width:26px;height:26px}
.tee-list{display:grid;gap:10px}
.tee-row{display:flex;gap:8px;align-items:stretch}
.tee-card{flex:1;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);
  padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 12px}
.tee-card .tee-dot{grid-row:1/3}
.tee-name{font-weight:700}
.tee-info{grid-column:2;font-size:14px;color:var(--muted)}
.tee-card .chev{grid-row:1/3;grid-column:3}
.tee-card.is-new{border-style:dashed;background:transparent}
.tee-card.is-new .tee-dot{opacity:.55}
.del{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);width:48px;color:var(--danger);flex:none}

/* Loch-Ansicht */
.hole-layout{flex:1;min-height:0;display:grid;grid-template-columns:calc(var(--sl) + 64px) 1fr}
.holes{overflow-y:auto;background:var(--surface-2);padding:8px 6px calc(var(--sb) + 12px) calc(var(--sl) + 6px);
  display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
.hn{position:relative;border:0;background:transparent;border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;line-height:1.1;flex:none}
.hn-no{font-weight:800;font-size:18px}
.hn-par{font-size:11px;color:var(--muted);font-weight:600}
.hn.has-notes::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hn.is-active{background:var(--accent);color:var(--on-accent)}
.hn.is-active .hn-par{color:inherit;opacity:.85}
.hn.is-active::after{background:var(--on-accent)}
.hn-sep.first{border:0;margin:0}
.hn-sep{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0 2px;border-top:1px solid var(--line);margin-top:4px}

.hole-main{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;
  padding:16px calc(var(--sr) + 14px) 0 14px}
.hole-inner{width:100%;max-width:720px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.hole-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hole-no{font-size:44px;font-weight:800;line-height:1}
.hole-props{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:700;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.len{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:0 10px;min-height:44px;color:var(--muted);font-weight:600}
.len input{width:52px;border:0;background:transparent;font:inherit;font-size:17px;font-weight:700;color:var(--text);text-align:right;outline:none;-moz-appearance:textfield}
.len input::-webkit-inner-spin-button,.len input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

.notes{margin-top:14px;display:grid;gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px 6px}
.note:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.note label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--text);font-size:12px;font-weight:800;letter-spacing:0}
.note textarea{display:block;width:100%;border:0;background:transparent;resize:none;font:inherit;font-size:17px;line-height:1.45;
  color:var(--text);min-height:2.9em;outline:none;padding:6px 0 4px;overflow:hidden}
.note textarea::placeholder{color:var(--muted);opacity:.6}

.actions{position:sticky;bottom:0;margin-top:auto;display:flex;gap:8px;
  padding:18px 0 calc(var(--sb) + 12px);background:linear-gradient(to bottom,transparent,var(--bg) 18px)}
.actions .grow{flex:1}
.actions .btn{min-height:50px;white-space:nowrap}
.unsaved{font-size:13px;color:var(--danger);font-weight:600;margin-top:6px;min-height:1.2em}

@media (min-width:700px){
  .hole-layout{grid-template-columns:calc(var(--sl) + 84px) 1fr}
  .hole-main{padding-left:24px;padding-right:calc(var(--sr) + 24px)}
}


/* Modus, Spielansicht */
.hole-head .seg.mode button{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:8px 11px}
.hole-head .seg.mode svg.i{width:16px;height:16px}
.hole-props{margin-top:12px}
.chip{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px}
.note{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}
.note-body{min-width:0}
.pnote{cursor:pointer;padding:12px 14px 12px}
.pnote:active{background:var(--surface-2)}
.plabel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ptext{font-size:22px;line-height:1.4;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}
.pnote.is-empty .ptext{font-size:15px;font-weight:400;font-style:italic;color:var(--muted)}
.is-play .hole-no{font-size:56px}

/* Fotos */
.photos-col{display:flex;flex-direction:column;gap:6px;width:60px;padding:2px 0 8px}
.thumb{position:relative;width:60px;height:60px;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--surface-2);display:block;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-weight:800;line-height:1}
.thumb.add svg.i{width:20px;height:20px}
.thumb.missing::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.book{margin-top:22px}
.book h2{display:flex;align-items:center;gap:8px}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.book-grid .thumb{width:100%;height:auto;aspect-ratio:3/4}
.small{font-size:13px}
@media (min-width:700px){ .photos-col{width:84px} .photos-col .thumb{width:84px;height:84px} }

/* Vollbild */
.viewer{position:fixed;inset:0;z-index:100;background:#000;color:#fff;user-select:none;-webkit-user-select:none}
.v-stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
.v-stage img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;will-change:transform;-webkit-user-drag:none;-webkit-touch-callout:none}
.v-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) 24px calc(var(--sl) + 12px);background:linear-gradient(rgba(0,0,0,.65),transparent);pointer-events:none}
.v-top > *{pointer-events:auto}
.v-btns{display:flex;gap:8px}
.v-count{font-weight:700}
.vbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:12px;min-width:44px;height:44px;padding:0 12px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vbtn:active{background:rgba(255,255,255,.3)}
.v-nav{position:absolute;top:50%;transform:translateY(-50%)}
.v-nav.prev{left:calc(var(--sl) + 8px)} .v-nav.next{right:calc(var(--sr) + 8px)}
.v-bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 16px);display:flex;gap:8px}
.v-bottom .vbtn{font-size:20px}

/* Malen */
.draw{position:fixed;inset:0;z-index:110;background:#111;color:#fff;display:flex;flex-direction:column}
.draw-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px calc(var(--sr) + 12px) 10px calc(var(--sl) + 12px)}
.draw-bar.top{padding-top:calc(var(--st) + 10px)}
.draw-bar.bottom{padding-bottom:calc(var(--sb) + 12px)}
.vbtn.save{background:var(--accent);color:var(--on-accent)}
.draw-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.draw-stage canvas{display:block;touch-action:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.swatches,.sizes{display:flex;gap:8px;align-items:center}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);padding:0}
.swatch[aria-pressed="true"]{border-color:#fff}
.size{width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center}
.size i{display:block;width:var(--s);height:var(--s);border-radius:50%;background:#fff}
.size[aria-pressed="true"]{background:rgba(255,255,255,.35)}

/* Teilen-Dialog */
.checks{display:grid;gap:8px;margin-top:12px}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-weight:600}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}

/* Dialog & Toast */
dialog.modal{border:0;border-radius:18px;padding:0;width:min(420px,calc(100vw - 32px));background:var(--surface);color:var(--text);
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.modal::backdrop{background:rgba(10,20,14,.45)}
dialog.modal form{padding:20px}
dialog.modal h3{margin:0 0 6px;font-size:19px}
dialog.modal p{margin:0 0 4px;color:var(--muted)}
dialog.modal input[name=v]{width:100%;margin-top:12px;padding:12px;font:inherit;font-size:17px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
.modal-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:18px}
.modal-btns.stack{flex-direction:column}
.modal-btns.stack .btn{width:100%}

#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#16241a;color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;transition:.25s;z-index:200;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,.csv,application/json,text/csv" hidden>
<input type="file" id="photoFile" accept="image/*" multiple hidden>
<script src="app.js?v=2.1"></script>
</body>
</html>
